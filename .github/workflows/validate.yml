name: 课表校验

on:
  push:
    branches:
      - main
    paths:
      - schedule-widget.json
      - index.html
      - apple-touch-icon.png
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 校验课表数据
        run: node .github/scripts/validate.js
